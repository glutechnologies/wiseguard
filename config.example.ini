# All settings are optional except wstunnel_url when wstunnel is used.
profiles_dir = ~/.config/wiseguard/profiles
wstunnel_url = wss://tunnel.example.net:443
tls_verify = true

# Local UDP listeners are allocated consecutively, one per WireGuard peer.
bind_address = 127.0.0.1
port_base = 55182
auto_timeout = 3s

# Optional binary overrides.
# wg_binary = /opt/homebrew/bin/wg
# wg_quick_binary = /opt/homebrew/bin/wg-quick
# wstunnel_binary = /opt/homebrew/bin/wstunnel

# Repeat this setting for each extra wstunnel argument.
# wstunnel_arg = --http-upgrade-path-prefix
# wstunnel_arg = vpn
